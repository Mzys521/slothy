[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personalized-adaptive-agent-core"
version = "0.1.0"
description = "Backend for the Personalized Adaptive Agent"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22,<1",
    "fastapi>=0.136,<1",
    "httpx>=0.28,<1",
    "langchain-core>=1.6.0,<2",
    "langchain-openai>=1.4.1,<2",
    "langchain-anthropic>=1.7,<2",
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
    "mcp>=1.30,<2",
    "jsonschema>=4.20,<5",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "python-docx>=1.2,<2",
    "typing-extensions>=4.15,<5",
    "uvicorn>=0.44,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<1",
]
documents = [
    "openpyxl>=3.1,<4",
    "reportlab>=4.4,<5",
    "python-pptx>=1,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

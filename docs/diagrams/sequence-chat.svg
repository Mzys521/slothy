<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc">
<title id="title">Chat Sequence</title><desc id="desc">Sequence diagram for a personalized chat request.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#78816D"/>
  </marker>
  <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#66864B"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#F7F5EF"/>
<text x="55" y="60" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#282820" text-anchor="start">CHAT REQUEST SEQUENCE</text><text x="55" y="92" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#66665A" text-anchor="start">对话主时序 · 在线读取画像、检索记忆并构建个性化上下文</text><rect x="5" y="130" width="130" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="70" y="164" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#282820" text-anchor="middle">User</text><line x1="70" y1="184" x2="70" y2="940" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><rect x="205" y="130" width="130" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="270" y="164" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#282820" text-anchor="middle">UI</text><line x1="270" y1="184" x2="270" y2="940" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><rect x="405" y="130" width="130" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="470" y="164" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#282820" text-anchor="middle">FastAPI</text><line x1="470" y1="184" x2="470" y2="940" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><rect x="615" y="130" width="130" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="680" y="164" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#282820" text-anchor="middle">LangGraph</text><line x1="680" y1="184" x2="680" y2="940" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><rect x="835" y="130" width="130" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="900" y="164" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#282820" text-anchor="middle">Profile</text><line x1="900" y1="184" x2="900" y2="940" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><rect x="1025" y="130" width="130" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="1090" y="164" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#282820" text-anchor="middle">Memory</text><line x1="1090" y1="184" x2="1090" y2="940" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><rect x="1235" y="130" width="130" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="1300" y="164" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#282820" text-anchor="middle">LLM</text><line x1="1300" y1="184" x2="1300" y2="940" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><line x1="70" y1="225" x2="270" y2="225" stroke="#55594B" stroke-width="2.2" marker-end="url(#arrow)"/><text x="170.0" y="216" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#55594B" text-anchor="middle">输入消息</text><line x1="270" y1="275" x2="470" y2="275" stroke="#55594B" stroke-width="2.2" marker-end="url(#arrow)"/><text x="370.0" y="266" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#55594B" text-anchor="middle">POST /chat</text><line x1="470" y1="325" x2="680" y2="325" stroke="#55594B" stroke-width="2.2" marker-end="url(#arrow)"/><text x="575.0" y="316" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#55594B" text-anchor="middle">invoke graph</text><line x1="680" y1="375" x2="900" y2="375" stroke="#55594B" stroke-width="2.2" marker-end="url(#arrow)"/><text x="790.0" y="366" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#55594B" text-anchor="middle">load_profile(user_id)</text><line x1="900" y1="425" x2="680" y2="425" stroke="#899080" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="790.0" y="416" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#899080" text-anchor="middle">profile snapshot</text><line x1="680" y1="475" x2="1090" y2="475" stroke="#55594B" stroke-width="2.2" marker-end="url(#arrow)"/><text x="885.0" y="466" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#55594B" text-anchor="middle">retrieve(query, user_id)</text><line x1="1090" y1="525" x2="680" y2="525" stroke="#899080" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="885.0" y="516" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#899080" text-anchor="middle">relevant memories</text><path d="M680,575 h55 v28 h-55" fill="none" stroke="#66864B" stroke-width="2.2" marker-end="url(#arrowAccent)"/><text x="745" y="593" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#66864B" text-anchor="start">build personalized context</text><line x1="680" y1="625" x2="1300" y2="625" stroke="#55594B" stroke-width="2.2" marker-end="url(#arrow)"/><text x="990.0" y="616" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#55594B" text-anchor="middle">prompt + user request</text><line x1="1300" y1="675" x2="680" y2="675" stroke="#899080" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="990.0" y="666" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#899080" text-anchor="middle">model response</text><line x1="680" y1="725" x2="470" y2="725" stroke="#899080" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="575.0" y="716" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#899080" text-anchor="middle">final response</text><line x1="470" y1="775" x2="270" y2="775" stroke="#899080" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="370.0" y="766" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#899080" text-anchor="middle">HTTP response</text><line x1="270" y1="825" x2="70" y2="825" stroke="#899080" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="170.0" y="816" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#899080" text-anchor="middle">render response</text><line x1="470" y1="885" x2="1090" y2="885" stroke="#66864B" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrowAccent)"/><text x="780.0" y="876" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#66864B" text-anchor="middle">enqueue memory update</text><path d="M1090,935 h55 v28 h-55" fill="none" stroke="#66864B" stroke-width="2.2" marker-end="url(#arrowAccent)"/><text x="1155" y="953" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#66864B" text-anchor="start">extract / validate / persist</text><text x="70" y="990" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#66665A" text-anchor="start">注：异步记忆任务在响应返回后执行；其失败不应撤销已成功返回的回答。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="title desc">
<title id="title">Memory Update Sequence</title><desc id="desc">Asynchronous memory extraction and profile update.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#78816D"/>
  </marker>
  <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#66864B"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#F7F5EF"/>
<text x="55" y="60" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#282820" text-anchor="start">MEMORY UPDATE SEQUENCE</text><text x="55" y="92" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#66665A" text-anchor="start">记忆提取与画像更新时序 · Asynchronous evolution pipeline</text><rect x="28" y="130" width="144" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="100" y="164" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#282820" text-anchor="middle">Application</text><line x1="100" y1="184" x2="100" y2="840" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><rect x="238" y="130" width="144" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="310" y="164" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#282820" text-anchor="middle">Observer</text><line x1="310" y1="184" x2="310" y2="840" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><rect x="448" y="130" width="144" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="520" y="164" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#282820" text-anchor="middle">Extractor</text><line x1="520" y1="184" x2="520" y2="840" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><rect x="658" y="130" width="144" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="730" y="164" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#282820" text-anchor="middle">Validator</text><line x1="730" y1="184" x2="730" y2="840" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><rect x="878" y="130" width="144" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="950" y="164" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#282820" text-anchor="middle">Memory Repo</text><line x1="950" y1="184" x2="950" y2="840" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><rect x="1108" y="130" width="144" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="1180" y="164" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#282820" text-anchor="middle">Profile Builder</text><line x1="1180" y1="184" x2="1180" y2="840" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><rect x="1318" y="130" width="144" height="54" rx="10" fill="#FFFFFF" stroke="#CFCABC" stroke-width="2"/><text x="1390" y="164" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#282820" text-anchor="middle">SQLite</text><line x1="1390" y1="184" x2="1390" y2="840" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="5 7"/><line x1="100" y1="235" x2="310" y2="235" stroke="#66864B" stroke-width="2.2" marker-end="url(#arrowAccent)"/><text x="205.0" y="226" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#66864B" text-anchor="middle">enqueue interaction</text><line x1="310" y1="295" x2="520" y2="295" stroke="#66864B" stroke-width="2.2" marker-end="url(#arrowAccent)"/><text x="415.0" y="286" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#66864B" text-anchor="middle">extract candidates</text><line x1="520" y1="355" x2="310" y2="355" stroke="#899080" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="415.0" y="346" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#899080" text-anchor="middle">candidate list</text><line x1="310" y1="415" x2="730" y2="415" stroke="#66864B" stroke-width="2.2" marker-end="url(#arrowAccent)"/><text x="520.0" y="406" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#66864B" text-anchor="middle">validate / classify</text><line x1="730" y1="475" x2="310" y2="475" stroke="#899080" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="520.0" y="466" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#899080" text-anchor="middle">validated candidates</text><line x1="310" y1="535" x2="950" y2="535" stroke="#66864B" stroke-width="2.2" marker-end="url(#arrowAccent)"/><text x="630.0" y="526" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#66864B" text-anchor="middle">upsert memory + evidence</text><line x1="950" y1="595" x2="1390" y2="595" stroke="#66864B" stroke-width="2.2" marker-end="url(#arrowAccent)"/><text x="1170.0" y="586" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#66864B" text-anchor="middle">BEGIN / INSERT / COMMIT</text><line x1="310" y1="655" x2="1180" y2="655" stroke="#66864B" stroke-width="2.2" marker-end="url(#arrowAccent)"/><text x="745.0" y="646" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#66864B" text-anchor="middle">rebuild profile from evidence</text><line x1="1180" y1="715" x2="1390" y2="715" stroke="#66864B" stroke-width="2.2" marker-end="url(#arrowAccent)"/><text x="1285.0" y="706" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#66864B" text-anchor="middle">read latest profile / write next version</text><line x1="1390" y1="775" x2="1180" y2="775" stroke="#899080" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1285.0" y="766" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#899080" text-anchor="middle">commit profile version</text><line x1="1180" y1="825" x2="310" y2="825" stroke="#899080" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="745.0" y="816" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#899080" text-anchor="middle">update result</text><text x="65" y="900" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#66665A" text-anchor="start">幂等要求：同一来源消息重复处理时，不应创建重复记忆；画像版本更新应采用事务和版本检查。</text></svg>
<text x="70" y="65" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#282820" text-anchor="start">PERSONALIZED ADAPTIVE AGENT</text><text x="70" y="98" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#66665A" text-anchor="start">总体架构 · MVP：FastAPI + LangGraph + 独立长期记忆与用户画像</text><rect x="55" y="135" width="1490" height="350" rx="22" fill="#F0EEE6" stroke="#CFCABC" stroke-width="2" stroke-dasharray="8 6"/><text x="75" y="165" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#55594B" text-anchor="start">在线推理链路 · Online Inference</text><rect x="55" y="535" width="1490" height="470" rx="22" fill="#F0EEE6" stroke="#CFCABC" stroke-width="2" stroke-dasharray="8 6"/><text x="75" y="565" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#55594B" text-anchor="start">记忆演化链路 · Memory Evolution</text><path d="M230,270 L300,270" fill="none" stroke="#899080" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500,270 L570,270" fill="none" stroke="#899080" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M770,270 L840,270" fill="none" stroke="#899080" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1110,270 L1180,270" fill="none" stroke="#899080" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1370,270 L1430,270" fill="none" stroke="#899080" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="75" y="215" width="155" height="110" rx="16" fill="#FFFDF8" stroke="#D6D1C5" stroke-width="2"/><rect x="75" y="215" width="7" height="110" rx="3" fill="#A18B63"/><text x="97" y="247" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#282820" text-anchor="start">用户</text><text x="97" y="275" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">User Input</text><rect x="300" y="215" width="200" height="110" rx="16" fill="#FFFFFF" stroke="#D6D1C5" stroke-width="2"/><rect x="300" y="215" width="7" height="110" rx="3" fill="#A18B63"/><text x="322" y="247" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#282820" text-anchor="start">前端界面</text><text x="322" y="275" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Web / Desktop UI</text><rect x="570" y="215" width="200" height="110" rx="16" fill="#FFFFFF" stroke="#D6D1C5" stroke-width="2"/><rect x="570" y="215" width="7" height="110" rx="3" fill="#66864B"/><text x="592" y="247" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#282820" text-anchor="start">FastAPI</text><text x="592" y="275" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Chat Application API</text><text x="592" y="297" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Auth / Validation</text><rect x="840" y="185" width="270" height="170" rx="16" fill="#F8FBF5" stroke="#D6D1C5" stroke-width="2"/><rect x="840" y="185" width="7" height="170" rx="3" fill="#66864B"/><text x="862" y="217" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#282820" text-anchor="start">LangGraph Runtime</text><text x="862" y="245" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Load Profile</text><text x="862" y="267" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Retrieve Memories</text><text x="862" y="289" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Build Context</text><text x="862" y="311" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Agent / Optional Tools</text><rect x="1180" y="215" width="190" height="110" rx="16" fill="#FFFFFF" stroke="#D6D1C5" stroke-width="2"/><rect x="1180" y="215" width="7" height="110" rx="3" fill="#66864B"/><text x="1202" y="247" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#282820" text-anchor="start">Model Provider</text><text x="1202" y="275" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">OpenAI-compatible API</text><rect x="1430" y="215" width="95" height="110" rx="16" fill="#FFFFFF" stroke="#D6D1C5" stroke-width="2"/><rect x="1430" y="215" width="7" height="110" rx="3" fill="#A18B63"/><text x="1452" y="247" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#282820" text-anchor="start">响应</text><text x="1452" y="275" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B5B50" text-anchor="start">Response</text><path d="M230,700 L300,700" fill="none" stroke="#66864B" stroke-width="2.5" marker-end="url(#arrowAccent)"/><path d="M510,700 L580,700" fill="none" stroke="#66864B" stroke-width="2.5" marker-end="url(#arrowAccent)"/><path d="M790,700 L860,700" fill="none" stroke="#66864B" stroke-width="2.5" marker-end="url(#arrowAccent)"/><path d="M1070,700 L1140,700" fill="none" stroke="#66864B" stroke-width="2.5" marker-end="url(#arrowAccent)"/><rect x="75" y="640" width="155" height="120" rx="16" fill="#FFFFFF" stroke="#D6D1C5" stroke-width="2"/><rect x="75" y="640" width="7" height="120" rx="3" fill="#A18B63"/><text x="97" y="672" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#282820" text-anchor="start">交互事件</text><text x="97" y="700" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Messages</text><text x="97" y="722" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Run metadata</text><rect x="300" y="640" width="210" height="120" rx="16" fill="#FFFFFF" stroke="#D6D1C5" stroke-width="2"/><rect x="300" y="640" width="7" height="120" rx="3" fill="#66864B"/><text x="322" y="672" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#282820" text-anchor="start">Memory Extractor</text><text x="322" y="700" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Candidate extraction</text><text x="322" y="722" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Classification</text><rect x="580" y="640" width="210" height="120" rx="16" fill="#FFFFFF" stroke="#D6D1C5" stroke-width="2"/><rect x="580" y="640" width="7" height="120" rx="3" fill="#66864B"/><text x="602" y="672" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#282820" text-anchor="start">Validator / Updater</text><text x="602" y="700" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Evidence check</text><text x="602" y="722" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Deduplicate / Merge</text><rect x="860" y="620" width="210" height="160" rx="16" fill="#FFFFFF" stroke="#D6D1C5" stroke-width="2"/><rect x="860" y="620" width="7" height="160" rx="3" fill="#66864B"/><text x="882" y="652" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#282820" text-anchor="start">Domain Services</text><text x="882" y="680" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Memory Repository</text><text x="882" y="702" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Profile Builder</text><text x="882" y="724" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">Version Manager</text><rect x="1140" y="620" width="350" height="160" rx="16" fill="#F8FBF5" stroke="#D6D1C5" stroke-width="2"/><rect x="1140" y="620" width="7" height="160" rx="3" fill="#66864B"/><text x="1162" y="652" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#282820" text-anchor="start">SQLite WAL</text><text x="1162" y="680" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">users / threads / messages</text><text x="1162" y="702" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">memory_items / evidence</text><text x="1162" y="724" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">user_profiles / versions</text><text x="1162" y="746" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5B50" text-anchor="start">retrieval &amp; audit logs</text><path d="M670,325 L670,640" fill="none" stroke="#66864B" stroke-width="2.5" marker-end="url(#arrowAccent)" stroke-dasharray="7 6"/><rect x="615.0" y="458.5" width="110" height="22" rx="8" fill="#F7F5EF"/><text x="670.0" y="474.5" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#66864B" text-anchor="middle">interaction</text><path d="M965,355 L965,620" fill="none" stroke="#66864B" stroke-width="2.5" marker-end="url(#arrowAccent)" stroke-dasharray="7 6"/><rect x="910.0" y="463.5" width="110" height="22" rx="8" fill="#F7F5EF"/><text x="965.0" y="479.5" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#66864B" text-anchor="middle">retrieve / profile</text><path d="M1240,620 L1240,355" fill="none" stroke="#66864B" stroke-width="2.5" marker-end="url(#arrowAccent)" stroke-dasharray="7 6"/><rect x="1185.0" y="463.5" width="110" height="22" rx="8" fill="#F7F5EF"/><text x="1240.0" y="479.5" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#66864B" text-anchor="middle">read</text><path d="M1490,700 L1530,700" fill="none" stroke="#66864B" stroke-width="2.5" marker-end="url(#arrowAccent)"/><text x="75" y="850" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#282820" text-anchor="start">关键边界</text><text x="75" y="885" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#55594B" text-anchor="start">• LangGraph State / Checkpointer 不等于长期记忆。</text><text x="75" y="915" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#55594B" text-anchor="start">• SQLite 保存事实；FTS5 / 向量索引是可重建的检索辅助设施。</text><text x="75" y="945" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#55594B" text-anchor="start">• 记忆写入异步执行；读取失败时 Agent 可降级为普通回答。</text><text x="1520" y="1040" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#77776B" text-anchor="end">v0.1 Architecture</text></svg>